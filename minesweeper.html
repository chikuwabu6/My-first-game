<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>JSマインスイーパー</title>
    <style>
      body {
        background: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(10, 30px);
        grid-template-rows: repeat(10, 30px);
        gap: 1px;
        background-color: #999;
        border: 3px solid #666;
      }
      .cell {
        width: 30px;
        height: 30px;
        background-color: #bdbdbd;
        border: 2px outset #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
      }
      .cell.open {
        border: 1px solid #999;
        background-color: #e0e0e0;
        cursor: default;
      }
      .cell.mine {
        background-color: red;
      }
      .info {
        margin: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="info">地雷を避けろ！ (左クリック: 開く / 右クリック: 旗)</div>
    <div id="board"></div>
    <div id="status" class="info"></div>

    <script>
      const SIZE = 10;
      const MINE_COUNT = 10;
      const boardElement = document.getElementById("board");
      const statusText = document.getElementById("status");

      let board = []; // { isMine: bool, isOpen: bool, isFlagged: bool, count: 0 }
      let gameOver = false;

      function init() {
        board = [];
        gameOver = false;
        statusText.textContent = "";
        boardElement.innerHTML = "";

        // 1. 盤面初期化
        for (let y = 0; y < SIZE; y++) {
          board[y] = [];
          for (let x = 0; x < SIZE; x++) {
            board[y][x] = {
              isMine: false,
              isOpen: false,
              isFlagged: false,
              count: 0,
            };
          }
        }

        // 2. 地雷設置
        let placed = 0;
        while (placed < MINE_COUNT) {
          let ry = Math.floor(Math.random() * SIZE);
          let rx = Math.floor(Math.random() * SIZE);
          if (!board[ry][rx].isMine) {
            board[ry][rx].isMine = true;
            placed++;
          }
        }

        // 3. 周辺の地雷数を計算
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (board[y][x].isMine) continue;
            let count = 0;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                let ny = y + dy,
                  nx = x + dx;
                if (
                  ny >= 0 &&
                  ny < SIZE &&
                  nx >= 0 &&
                  nx < SIZE &&
                  board[ny][nx].isMine
                )
                  count++;
              }
            }
            board[y][x].count = count;
          }
        }
        draw();
      }

      function draw() {
        boardElement.innerHTML = "";
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const cellData = board[y][x];
            const cell = document.createElement("div");
            cell.className = "cell";
            if (cellData.isOpen) {
              cell.classList.add("open");
              if (cellData.isMine) {
                cell.textContent = "💣";
                cell.classList.add("mine");
              } else if (cellData.count > 0) {
                cell.textContent = cellData.count;
              }
            } else if (cellData.isFlagged) {
              cell.textContent = "🚩";
            }

            cell.onclick = () => openCell(y, x);
            cell.oncontextmenu = (e) => {
              e.preventDefault();
              toggleFlag(y, x);
            };
            boardElement.appendChild(cell);
          }
        }
      }

      function openCell(y, x) {
        if (gameOver || board[y][x].isOpen || board[y][x].isFlagged) return;

        board[y][x].isOpen = true;

        if (board[y][x].isMine) {
          endGame(false);
        } else {
          // 0だったら周囲を自動で開く（再帰）
          if (board[y][x].count === 0) {
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                let ny = y + dy,
                  nx = x + dx;
                if (ny >= 0 && ny < SIZE && nx >= 0 && nx < SIZE)
                  openCell(ny, nx);
              }
            }
          }
          checkWin();
        }
        draw();
      }

      function toggleFlag(y, x) {
        if (gameOver || board[y][x].isOpen) return;
        board[y][x].isFlagged = !board[y][x].isFlagged;
        draw();
      }

      function checkWin() {
        const safeCells = board.flat().filter((c) => !c.isMine);
        if (safeCells.every((c) => c.isOpen)) endGame(true);
      }

      function endGame(isWin) {
        gameOver = true;
        statusText.textContent = isWin
          ? "クリア！おめでとう！"
          : "ゲームオーバー...";
        // 地雷を全表示
        board.flat().forEach((c) => {
          if (c.isMine) c.isOpen = true;
        });
      }

      init();
    </script>
  </body>
</html>
